<div class="pane-header">
  <span class="pane-header-title">Reading view</span>
  <button
    type="button"
    class="pane-settings-toggle"
    aria-expanded="false"
    aria-controls="reading-settings"
    hidden
  >
    Layers
  </button>
</div>
<div class="pane-reading-layout">
  <div class="pane-body" id="rendered-pane"></div>
  <div class="viewer-settings-layer" hidden>
    <button
      type="button"
      class="viewer-settings-scrim"
      tabindex="-1"
      aria-label="Close layers"
    ></button>
    <aside
      class="viewer-settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reading-settings-title"
    >
      <div class="viewer-settings-header">
        <h2 class="viewer-settings-title" id="reading-settings-title">Layers</h2>
        <button type="button" class="viewer-settings-close" aria-label="Close layers">
          ×
        </button>
      </div>
      <div class="viewer-settings-body">
        <div
          class="settings-subgroup"
          role="group"
          aria-labelledby="reading-settings-title"
        >
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-furniture" checked />
            <span>Furniture</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-background" checked />
            <span>Background</span>
          </label>
        </div>
      </div>
    </aside>
  </div>
</div>
