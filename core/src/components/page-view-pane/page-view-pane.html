<div class="pane-header">
  <span class="pane-header-title">Original page</span>
  <div class="pane-page-controls">
    <div class="page-zoom-control" hidden>
      <label class="page-zoom-control-label">
        <span aria-hidden="true">Zoom</span>
        <input
          type="range"
          class="zoom-input"
          min="100"
          max="300"
          step="10"
          value="100"
          aria-valuemin="100"
          aria-valuemax="300"
          aria-valuenow="100"
          aria-label="Page zoom"
        />
      </label>
      <button
        type="button"
        class="page-zoom-reset"
        title="Reset zoom"
        aria-label="Reset zoom"
        disabled
      >
        100%
      </button>
    </div>
    <button type="button" class="pane-settings-toggle" aria-expanded="false" hidden>
      Overlays
    </button>
  </div>
</div>
<div class="pane-page-layout">
  <div class="pane-body" id="page-pane" tabindex="0"></div>
  <div class="viewer-settings-layer" hidden>
    <button
      type="button"
      class="viewer-settings-scrim"
      tabindex="-1"
      aria-label="Close overlays"
    ></button>
    <aside
      class="viewer-settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="page-settings-title"
    >
      <div class="viewer-settings-header">
        <h2 class="viewer-settings-title" id="page-settings-title">Overlays</h2>
        <button type="button" class="viewer-settings-close" aria-label="Close overlays">
          ×
        </button>
      </div>
      <div class="viewer-settings-body">
        <label class="settings-option settings-option-primary">
          <input type="checkbox" class="cb-all-bboxes" checked />
          <span>Layout</span>
        </label>
        <div class="settings-subgroup">
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-reading-order" />
            <span>Reading order</span>
          </label>
          <div class="settings-subgroup settings-reading-order-group">
            <label class="settings-option settings-option-sub settings-option-nested">
              <input type="checkbox" class="cb-reading-order-arrows" checked />
              <span>Arrows</span>
            </label>
            <label class="settings-option settings-option-sub settings-option-nested">
              <input type="checkbox" class="cb-reading-order-global" />
              <span>Global numbering</span>
            </label>
          </div>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-picture-contents" />
            <span>Picture contents</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-table-contents" />
            <span>Table contents</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-fragment-links" />
            <span>Fragments</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-xref-links" />
            <span>Cross-references</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-caption-links" />
            <span>Captions</span>
          </label>
          <label class="settings-option settings-option-sub">
            <input type="checkbox" class="cb-layout-badges" checked />
            <span>Badges</span>
          </label>
        </div>
      </div>
    </aside>
  </div>
</div>
