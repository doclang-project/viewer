<div class="toolbar">
  <div class="toolbar-options-wrap">
    <button
      type="button"
      class="toolbar-options-btn"
      aria-expanded="false"
      aria-haspopup="true"
    >
      Views
    </button>
    <div class="toolbar-options-panel" role="menu" hidden>
      <label class="toolbar-options-item">
        <input type="checkbox" class="cb-file-pane" role="menuitemcheckbox" checked />
        <span>Files</span>
      </label>
      <label class="toolbar-options-item">
        <input type="checkbox" class="cb-page-pane" role="menuitemcheckbox" checked />
        <span>Original page</span>
      </label>
      <label class="toolbar-options-item">
        <input type="checkbox" class="cb-markup-pane" role="menuitemcheckbox" checked />
        <span>DocLang</span>
      </label>
      <label class="toolbar-options-item">
        <input
          type="checkbox"
          class="cb-reading-pane"
          role="menuitemcheckbox"
          checked
        />
        <span>Reading view</span>
      </label>
      <div class="toolbar-options-divider" role="separator"></div>
      <button type="button" class="toolbar-options-reset" role="menuitem">
        Reset views
      </button>
    </div>
  </div>
  <span class="header-divider" aria-hidden="true"></span>
  <span class="toolbar-file-group">
    <label class="file-btn">
      Open file
      <input
        type="file"
        class="input-archive"
        multiple
        accept=".dclx,.zip,.dclg,.xml,application/zip,application/xml,text/xml"
      />
    </label>
  </span>
  <button type="button" class="btn-demo">Load demo</button>
  <span class="header-divider" aria-hidden="true"></span>
  <a href="https://doclang.ai/" class="header-site-link">doclang.ai</a>
</div>
